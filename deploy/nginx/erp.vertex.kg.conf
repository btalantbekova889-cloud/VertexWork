# Nginx reverse proxy for VERTEX ERP — erp.vertex.kg
#
# Install:
#   sudo cp deploy/nginx/erp.vertex.kg.conf /etc/nginx/sites-available/erp.vertex.kg.conf
#   sudo ln -s /etc/nginx/sites-available/erp.vertex.kg.conf /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# Then issue the SSL certificate (see deploy/scripts/setup-ssl.sh), which will
# rewrite the server block below to add the listen 443 ssl directives via certbot.

server {
    listen 80;
    listen [::]:80;
    server_name erp.vertex.kg;

    # Let certbot's HTTP-01 challenge through before SSL is provisioned
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name erp.vertex.kg;

    ssl_certificate     /etc/letsencrypt/live/erp.vertex.kg/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/erp.vertex.kg/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparam.pem;

    client_max_body_size 20m;

    # Next.js handles everything, including proxying /api/* to the
    # Fastify backend internally (see apps/web/next.config.ts rewrites).
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
